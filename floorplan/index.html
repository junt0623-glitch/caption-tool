<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>展覧会図面作成アプリ - プロトタイプ</title>
<style>
  :root{
    --ink:#1c1c1e;
    --paper:#fdfdfb;
    --grid:#e4e2da;
    --grid-major:#d0cdc2;
    --accent:#b3541e;      /* 朱 — 選択・作品番号 */
    --wall:#2b2b2e;
    --fixture:#8a8578;
    --case:#5c7c8a;        /* 可動ケース */
    --panel:#f3f1ea;
    --line:#c9c5b8;
    --radius:6px;
    font-size:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
    color:var(--ink);background:var(--panel);
    display:flex;flex-direction:column;overflow:hidden;
  }

  /* ── 上部バー ─────────────────────── */
  header{
    display:flex;align-items:center;gap:12px;
    padding:8px 14px;background:var(--ink);color:#f5f3ec;flex-wrap:wrap;
  }
  header h1{font-size:15px;font-weight:600;letter-spacing:.06em;margin-right:8px}
  header h1 small{font-weight:400;opacity:.6;margin-left:6px;letter-spacing:.1em}
  .hbtn{
    background:transparent;color:#f5f3ec;border:1px solid #55534c;
    border-radius:var(--radius);padding:5px 12px;cursor:pointer;font-size:13px;
  }
  .hbtn:hover{background:#33322f}
  .hbtn.primary{background:var(--accent);border-color:var(--accent)}
  .hbtn.primary:hover{filter:brightness(1.1)}
  header .spacer{flex:1}
  header select, header input[type=number]{
    background:#33322f;color:#f5f3ec;border:1px solid #55534c;
    border-radius:var(--radius);padding:5px 8px;font-size:13px;
  }
  header input[type=number]{width:60px}
  header label{font-size:12px;opacity:.75}

  /* ── メインレイアウト ─────────────── */
  main{flex:1;display:flex;min-height:0}

  /* ツールバー */
  #toolbar{
    width:88px;background:#efede5;border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:6px;
  }
  .tool{
    width:72px;padding:8px 4px;border:1px solid transparent;border-radius:var(--radius);
    background:transparent;cursor:pointer;font-size:11px;color:var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:3px;
  }
  .tool span.ic{font-size:18px;line-height:1}
  .tool:hover{background:#e4e1d6}
  .tool.active{background:#fff;border-color:var(--accent);color:var(--accent);font-weight:600}
  #toolbar hr{width:56px;border:none;border-top:1px solid var(--line);margin:6px 0}

  /* キャンバス領域 */
  #canvasWrap{flex:1;position:relative;overflow:hidden;background:#dad7cc}
  svg#plan{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  #zoomCtrl{
    position:absolute;left:12px;bottom:12px;display:flex;gap:4px;
    background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:4px;
  }
  #zoomCtrl button{border:none;background:transparent;width:28px;height:28px;cursor:pointer;font-size:15px;border-radius:4px}
  #zoomCtrl button:hover{background:var(--panel)}
  #hint{
    position:absolute;top:10px;left:50%;transform:translateX(-50%);
    background:rgba(28,28,30,.85);color:#f5f3ec;font-size:12px;
    padding:5px 14px;border-radius:20px;pointer-events:none;white-space:nowrap;
  }

  /* 右パネル */
  #side{
    width:280px;background:var(--paper);border-left:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;
  }
  #side h2{
    font-size:12px;letter-spacing:.12em;font-weight:600;color:#6d6a60;
    padding:12px 14px 6px;border-bottom:1px solid var(--line);
  }
  #props{padding:12px 14px;border-bottom:1px solid var(--line)}
  #props .empty{font-size:12px;color:#8c887c}
  .field{margin-bottom:8px}
  .field label{display:block;font-size:11px;color:#6d6a60;margin-bottom:2px}
  .field input,.field textarea{
    width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:4px;
    font-size:13px;font-family:inherit;background:#fff;
  }
  .field .pair{display:flex;gap:6px}
  .field .pair input{flex:1}
  #props .del{
    margin-top:4px;width:100%;padding:6px;border:1px solid #c33;color:#c33;
    background:#fff;border-radius:4px;cursor:pointer;font-size:12px;
  }
  #props .del:hover{background:#c33;color:#fff}
  .sbtn{
    flex:1;padding:5px 7px;border:1px solid var(--line);background:#fff;
    border-radius:4px;cursor:pointer;font-size:12px;
  }
  .sbtn:hover{border-color:var(--accent);color:var(--accent)}
  #props .note{font-size:11px;color:#8c887c;margin-bottom:8px}
  .algrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  #props select{
    width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:4px;
    font-size:13px;font-family:inherit;background:#fff;
  }

  /* レイヤーバー */
  #layerBar{
    display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 14px;
    border-bottom:1px solid var(--line);font-size:12px;
  }
  #layerBar label{display:flex;align-items:center;gap:4px;cursor:pointer;color:var(--ink)}

  /* 作品リスト */
  #workListWrap{flex:1;overflow-y:auto}
  #workList{list-style:none}
  #workList li{
    display:flex;align-items:center;gap:8px;padding:7px 14px;
    border-bottom:1px solid #eee9dd;cursor:pointer;font-size:13px;
  }
  #workList li:hover{background:var(--panel)}
  #workList li.sel{background:#fbe9dc}
  #workList .num{
    flex:none;min-width:22px;height:20px;border-radius:10px;padding:0 6px;
    background:var(--accent);color:#fff;font-size:11px;
    display:flex;align-items:center;justify-content:center;font-weight:600;
  }
  #workList .thumb{flex:none;width:34px;height:34px;object-fit:cover;border-radius:3px;border:1px solid var(--line)}
  #workList .meta{min-width:0;flex:1}
  #workList .meta .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #workList .meta .s{font-size:11px;color:#8c887c}
  #workList .none{padding:14px;font-size:12px;color:#8c887c}

  /* SVG内の要素スタイル */
  /* 注意: SVGはCSSがプレゼンテーション属性より優先されるため、
     font-size等はここに書かず属性側で指定する */
  .wall-line{stroke:var(--wall);stroke-linecap:square}
  .obj.selected .body{stroke:var(--accent);stroke-width:45}
  .badge circle{fill:var(--accent)}
  .badge text{fill:#fff;font-weight:600;text-anchor:middle;dominant-baseline:central}
  .obj text.lbl{fill:var(--ink);text-anchor:middle;pointer-events:none}
  .obj{cursor:move}
  .stock{cursor:copy}
  .stock.empty{cursor:not-allowed}
  .stock text.lbl{fill:var(--ink);text-anchor:middle;pointer-events:none}

  /* 印刷 */
  /* 画像フォルダ(モーダル) */
  #libModal{
    position:fixed;inset:0;background:rgba(28,28,30,.55);
    display:flex;align-items:center;justify-content:center;z-index:50;
  }
  #libModal[hidden]{display:none}
  #libBox{
    background:var(--paper);border-radius:8px;width:min(760px,92vw);max-height:86vh;
    display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.3);
  }
  #libBox header{
    background:transparent;color:var(--ink);border-bottom:1px solid var(--line);
    padding:12px 16px;gap:10px;flex-wrap:nowrap;
  }
  #libBox h3{font-size:14px;font-weight:600;flex:1}
  #libBox .sub{font-size:11px;color:#8c887c;font-weight:400}
  /* flex:1(basis 0)にすると中身が高さに寄与せずグリッドが潰れるため basis は auto */
  #libGrid{
    flex:1 1 auto;min-height:0;overflow-y:auto;padding:14px 16px;display:grid;gap:12px;
    grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  }
  #libGrid .empty{grid-column:1/-1;color:#8c887c;font-size:13px;padding:24px 4px;text-align:center;line-height:1.7}
  .libcard{
    border:1px solid var(--line);border-radius:6px;background:#fff;overflow:hidden;
    display:flex;flex-direction:column;cursor:pointer;
  }
  .libcard:hover{border-color:var(--accent)}
  .libcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
  .libcard img{width:100%;height:104px;object-fit:contain;background:var(--panel);display:block}
  .libcard .nm{font-size:11px;padding:5px 6px;word-break:break-all;line-height:1.4}
  .libcard .nm b{color:var(--accent)}
  .libcard .rm{
    border:none;border-top:1px solid var(--line);background:#fff;color:#c33;
    font-size:11px;padding:4px;cursor:pointer;
  }
  .libcard .rm:hover{background:#c33;color:#fff}
  #libFoot{border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center}
  #libFoot .note{flex:1;margin:0;font-size:11px;color:#8c887c}

  /* 在庫パネル(モーダル) */
  #stockModal{
    position:fixed;inset:0;background:rgba(28,28,30,.55);
    display:flex;align-items:center;justify-content:center;z-index:50;
  }
  #stockModal[hidden]{display:none}
  #stockBox{
    background:var(--paper);border-radius:8px;width:min(680px,94vw);max-height:86vh;
    display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.3);
  }
  #stockBox header{
    background:transparent;color:var(--ink);border-bottom:1px solid var(--line);
    padding:12px 16px;gap:10px;flex-wrap:nowrap;
  }
  #stockBox h3{font-size:14px;font-weight:600;flex:1}
  #stockBox .sub{font-size:11px;color:#8c887c;font-weight:400;display:block;margin-top:2px}
  #stockWrap{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 16px}
  #stockTable{width:100%;border-collapse:collapse;font-size:13px}
  #stockTable th,#stockTable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
  #stockTable th{
    position:sticky;top:0;background:var(--paper);font-size:11px;color:#6d6a60;
    font-weight:600;text-align:right;
  }
  #stockTable th:first-child,#stockTable td:first-child{text-align:left}
  #stockTable td.size{color:#8c887c;font-size:11px;text-align:left}
  #stockTable tr.cat td{
    background:var(--panel);font-size:11px;color:#6d6a60;font-weight:600;text-align:left;
  }
  #stockTable input{
    width:64px;padding:3px 6px;border:1px solid var(--line);border-radius:4px;
    font-size:13px;font-family:inherit;text-align:right;background:#fff;
  }
  #stockTable td.remain{font-weight:600;color:var(--accent)}
  #stockTable td.remain.zero{color:#999}
  #stockTable td.remain.over{color:#c33}
  #stockFoot{border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center}
  #stockFoot .note{flex:1;margin:0;font-size:11px;color:#8c887c}

  @media print{
    header,#toolbar,#side,#zoomCtrl,#hint,#libModal,#stockModal{display:none!important}
    body{background:#fff}
    #canvasWrap{position:fixed;inset:0;background:#fff}
    /* 在庫パレットは印刷範囲の外にある編集用のUIなので用紙には出さない */
    #plan .stock{display:none!important}
    /* 印刷範囲の外にはみ出したものが用紙の余白部分に写り込まないようクリップする */
    #plan .sheet-root{clip-path:url(#sheetClip)}
  }
</style>
<!-- 印刷時に用紙サイズ(A3横/縦)を印刷範囲に合わせて差し込む。printBtnが書き換える -->
<style id="pageStyle"></style>
</head>
<body>

<header>
  <h1>展覧会図面作成<small>プロトタイプ</small></h1>
  <label>印刷範囲(A3)の回転
    <select id="sheetSel" title="印刷範囲(A3)を90度きざみで回転します。展示室図面もこの回転に合わせて一緒に回転し、縦横比も印刷範囲に対応します">
      <option value="0" selected>0°(横)</option>
      <option value="90">90°(縦)</option>
      <option value="180">180°(横)</option>
      <option value="270">270°(縦)</option>
    </select>
  </label>
  <label>縮尺
    <input id="scalePct" type="number" min="0" max="150" step="1" value="100"
      title="可動ケース・展示台の図面に対する大きさ(0〜150%)"> %
  </label>
  <button class="hbtn" id="undoBtn" title="元に戻す (Ctrl+Z)">↩ 元に戻す</button>
  <button class="hbtn" id="redoBtn" title="やり直し (Ctrl+Y / Ctrl+Shift+Z)">↪ やり直し</button>
  <div class="spacer"></div>
  <button class="hbtn" id="wlBtn" title="作品リスト(CSV)を読み込み。「番号」列の番号が図面に表示されます">📋 作品リスト</button>
  <button class="hbtn" id="imgsBtn" title="画像フォルダを開く。あらかじめ画像を入れておき、図面上の作品をダブルクリックして選べます">🗂 画像フォルダ</button>
  <button class="hbtn" id="stockBtn" title="ケース・展示台の使用数と残数を確認。他の展示室で使った台数もここで入力します">📦 在庫</button>
  <input type="file" id="wlInput" accept=".csv,.tsv,.txt" hidden>
  <input type="file" id="imgsInput" accept="image/*" multiple hidden>
  <button class="hbtn" id="loadBtn">📂 読み込み</button>
  <button class="hbtn" id="saveBtn">💾 保存 (JSON)</button>
  <button class="hbtn" id="pngBtn">🖼 PNG書き出し</button>
  <button class="hbtn primary" id="printBtn">🖨 印刷実行</button>
  <input type="file" id="fileInput" accept=".json" hidden>
</header>

<main>
  <nav id="toolbar">
    <button class="tool active" data-tool="select"><span class="ic">↖</span>選択/移動</button>
    <button class="tool" data-tool="wall"><span class="ic">╱</span>壁を描く</button>
    <hr>
    <button class="tool" data-tool="work"><span class="ic">🖼</span>作品</button>
    <button class="tool" data-tool="text"><span class="ic">あ</span>テキスト</button>
    <hr>
    <button class="tool" data-tool="erase"><span class="ic">✕</span>削除</button>
  </nav>

  <div id="canvasWrap">
    <svg id="plan" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="zoomCtrl">
      <button id="zoomOut" title="縮小">−</button>
      <button id="zoomFit" title="全体表示">⌂</button>
      <button id="zoomIn" title="拡大">＋</button>
    </div>
    <div id="hint">ツールを選んで図面上をクリック/ドラッグ</div>
  </div>

  <aside id="side">
    <h2>レイヤー</h2>
    <div id="layerBar">
      <label><input type="checkbox" data-layer="room" checked>展示室図面</label>
      <label><input type="checkbox" data-layer="furniture" checked>ケース・展示台</label>
      <label><input type="checkbox" data-layer="work" checked>作品</label>
      <label><input type="checkbox" data-layer="text" checked>テキスト</label>
    </div>
    <h2>プロパティ</h2>
    <div id="props"><div class="empty">オブジェクトを選択すると編集できます</div></div>
    <h2>作品リスト</h2>
    <div id="workListWrap"><ul id="workList"></ul></div>
  </aside>
</main>

<!-- 画像フォルダ。ヘッダーの「🗂 画像フォルダ」で一覧・追加、
     図面上の作品をダブルクリックすると選択モードで開く -->
<div id="libModal" hidden>
  <div id="libBox">
    <header>
      <h3 id="libTitle">画像フォルダ</h3>
      <button class="sbtn" id="libAddBtn" style="flex:none;width:auto">＋ 画像を追加</button>
      <button class="sbtn" id="libClose" style="flex:none;width:auto">閉じる</button>
    </header>
    <div id="libGrid"></div>
    <div id="libFoot">
      <div class="note" id="libNote"></div>
      <button class="sbtn" id="libClear" style="flex:none;width:auto">選択中の作品から画像を外す</button>
    </div>
  </div>
</div>

<!-- 在庫パネル。この図面での使用数と、他の展示室(別の図面)で使った台数を突き合わせて残数を出す -->
<div id="stockModal" hidden>
  <div id="stockBox">
    <header>
      <h3>ケース・展示台の在庫 <span class="sub">「他の図面」に別の展示室で使った台数を入れると残数に反映されます</span></h3>
      <button class="sbtn" id="stockClose" style="flex:none;width:auto">閉じる</button>
    </header>
    <div id="stockWrap"><table id="stockTable"></table></div>
    <div id="stockFoot">
      <div class="note" id="stockNote"></div>
      <button class="sbtn" id="stockResetOther" style="flex:none;width:auto">「他の図面」をすべて0に戻す</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   展覧会図面作成アプリ(再構築版)
   単位: 内部座標は mm。表示は 0.1px/mm を基準にviewBoxで拡縮。
   ============================================================ */

const SVG_NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("plan");
const GRID = 500;            // グリッド 500mm
const WALL_T = 150;          // 壁厚 150mm
const SHEET = {w: 42000, h: 29700}; // 図面範囲(mm)。A3実寸×100を基準に回転(0/90/180/270)で切替
const A3_LANDSCAPE = [420, 297];    // A3実寸(mm)。回転が90/270のときは幅高を入れ替える
const BASE_SHEET_W = A3_LANDSCAPE[0]*100, BASE_SHEET_H = A3_LANDSCAPE[1]*100; // 常にA3横基準(展示室図面のサイズ計算用)

/* ---- レイヤー構成 ----
   最背面: 展示室図面(state.rooms) → 壁 → ケース・展示台 → 作品 → テキスト(最前面)
   表示/非表示は layerVis(保存対象外のビュー状態) */
const layerVis = {room:true, furniture:true, work:true, text:true};
const layerOf = o => o.type==="work" ? 1 : o.type==="text" ? 2 : 0;

/* 展示室図面のデフォルト4面。img は読み込んだ図面画像(dataURL)。
   回転は個別には持たず、印刷範囲(state.sheet.rot)と共通の値を使う */
function defaultRooms(){
  return {current:"", list:[
    {id:"r1a1", name:"展示室1-A（旧第1）", img:null, scale:100, dx:0, dy:0, op:70},
    {id:"r1a2", name:"展示室1-A（旧第2）", img:null, scale:100, dx:0, dy:0, op:70},
    {id:"r1b",  name:"展示室1-B",          img:null, scale:100, dx:0, dy:0, op:70},
    {id:"r2b",  name:"展示室2-B",          img:null, scale:100, dx:0, dy:0, op:70},
  ]};
}

/* 可動ケース・展示台の在庫。種類ごと1つだけパレット表示し、取り出すと残数が減る。
   残数 = total − この図面での使用数 − 他の図面での使用数(state.usedElsewhere)
   back:true は「背景つき」ケース。長辺の1本を太い線で描いて背景板を表す */
function defaultStock(){
  return [
    {key:"c_alpha",  cat:"case", name:"α",              w:2400, h:1800, total:2},
    {key:"c_beta",   cat:"case", name:"β",              w:2400, h:1200, total:3},
    {key:"c_180",    cat:"case", name:"180角",          w:1800, h:1800, total:4},
    {key:"c_ym",     cat:"case", name:"横長免震",       w:1800, h:1000, total:3},
    {key:"c_ymb",    cat:"case", name:"横長免震背景",   w:1800, h:1000, total:3, back:true},
    {key:"c_yh",     cat:"case", name:"横長非免震",     w:1800, h:1000, total:2},
    {key:"c_yhb",    cat:"case", name:"横長非免震背景", w:1800, h:1000, total:3, back:true},
    {key:"c_andon",  cat:"case", name:"行燈免震",       w:1000, h:1000, total:5},
    {key:"c_andonh", cat:"case", name:"行燈非免震",     w:1000, h:1000, total:1},
    {key:"c_nozoki", cat:"case", name:"のぞき",         w:1800, h:1000, total:5},
    {key:"p_153",    cat:"ped",  name:"1.53×0.9",       w:1530, h:900,  total:27},
    {key:"p_180",    cat:"ped",  name:"1.8×0.9",        w:1800, h:900,  total:24},
    {key:"p_090",    cat:"ped",  name:"0.9×0.9",        w:900,  h:900,  total:7},
    {key:"p_200",    cat:"ped",  name:"2.0×2.0",        w:2000, h:2000, total:2},
    {key:"p_120",    cat:"ped",  name:"1.2×0.9",        w:1200, h:900,  total:30},
  ];
}
function stockDef(key){ return state.stock.find(t=>t.key===key) || null; }
/* この図面で使っている台数 */
function stockUsed(key){ return state.objects.filter(o=>o.stockKey===key).length; }
/* 他の展示室(別の図面)で使っている台数。ユーザーが在庫パネルで手入力する */
function stockElsewhere(key){ return Math.max(0, Math.round(+(state.usedElsewhere?.[key]) || 0)); }
/* 残数。他図面ぶんを引くのでマイナスにもなり得る(取りすぎの警告として見せる) */
function stockRemain(key){
  const s = stockDef(key);
  return s ? s.total - stockUsed(key) - stockElsewhere(key) : 0;
}
/* 背景つきケースかどうか(配置済みオブジェクトは stockKey から引く) */
function isBackCase(o){ return !!stockDef(o.stockKey)?.back; }

/* ---- 状態 ---- */
let idSeq = 1;
let state = {
  meta: {title:"", venue:"", author:"", date: today()}, // JSONファイル名等で使用。図面上には表示しない
  sheet: {rot:0}, // 印刷範囲(A3)の回転角(0/90/180/270)
  scalePct: 100,           // ケース・展示台の表示縮尺(0〜150%)
  rooms: defaultRooms(),
  workList: [],            // 作品リスト(CSV) [{no,title,artist}]
  library: [],             // 画像フォルダ [{id,name,no,img}] アップロード済み画像。JSON保存に含まれる
  usedElsewhere: {},       // 他の展示室(別の図面)での使用台数 stockKey→台数。残数から差し引く
  images: {},              // 旧形式の作品画像 番号→dataURL(読み込み時にlibraryへ移行する)
  stock: defaultStock(),
  walls: [],               // {id,x1,y1,x2,y2}
  objects: []              // {id,type:'work'|'case'|'fixture'|'text', x,y,w,h,rot, no,label,stockKey,imgId,img}
};
let libSeq = 1;            // 画像フォルダのID採番

/* 作品に表示する画像を決める。優先順位:
   1) imgId … 図面上でダブルクリックして画像フォルダから明示的に選んだもの(最優先)
   2) img   … 旧形式の個別指定画像
   3) 番号一致 … 画像フォルダ内でファイル名の番号が作品番号と一致するもの(一括読込の自動対応)
   4) state.images … 旧形式の一括読込画像 */
function libItem(id){ return state.library.find(it=>it.id===id) || null; }
function workImage(o){
  if (o.imgId){ const it = libItem(o.imgId); if (it) return it.img; }
  if (o.img) return o.img;
  const key = String(o.no ?? "");
  if (key){
    const byNo = state.library.find(it=>it.no && it.no === key);
    if (byNo) return byNo.img;
    if (state.images[key]) return state.images[key];
  }
  return null;
}
/* 番号に対応する画像(作品リストのサムネイル用。配置前の作品にも使う) */
function imageForNo(no){
  const key = String(no ?? ""); if (!key) return null;
  const byNo = state.library.find(it=>it.no && it.no === key);
  return byNo ? byNo.img : (state.images[key] || null);
}
/* 画像フォルダに1件追加(同名ファイルは上書きせず別エントリとして持つ) */
function addToLibrary(name, img){
  const item = {id: "L" + (libSeq++), name, no: normNo(name), img};
  state.library.push(item);
  return item;
}
let tool = "select";
let selectedIds = new Set();  // 複数選択。selectedId は主選択(プロパティ表示・整列の基準)
let selectedId = null;
let undoStack = [];
let redoStack = [];

/* 選択ヘルパー */
function selectOnly(id){ selectedIds = new Set(id==null?[]:[id]); selectedId = id; }
function toggleSelect(id){
  if (selectedIds.has(id)){ selectedIds.delete(id); if (selectedId===id) selectedId = [...selectedIds].pop() ?? null; }
  else { selectedIds.add(id); selectedId = id; }
}
function clearSelect(){ selectedIds.clear(); selectedId = null; }

/* 印刷範囲(A3)を90度きざみで回転した図面範囲。0°/180°は横向き、90°/270°は縦向き
   (矩形なので見た目は0°と180°、90°と270°で同じになるが、回転の角度自体は保持する)。
   展示室図面の画像はこの範囲内に最大サイズで自動フィットする */
function normRot(deg){ return ((Math.round((deg||0)/90)*90) % 360 + 360) % 360; }
/* 指定の回転角でのシート寸法[w,h]を返す(副作用なし。SHEETを書き換えるのはapplySheet) */
function sheetDimsForRot(rot){
  const landscape = normRot(rot) % 180 === 0;
  const [pw, ph] = landscape ? A3_LANDSCAPE : [A3_LANDSCAPE[1], A3_LANDSCAPE[0]];
  return [pw*100, ph*100];
}
function applySheet(){
  const [w,h] = sheetDimsForRot(state.sheet?.rot);
  SHEET.w = w; SHEET.h = h;
}
function syncSheetUI(){
  document.getElementById("sheetSel").value = String(normRot(state.sheet?.rot));
  document.getElementById("scalePct").value = state.scalePct ?? 100;
  applySheet();
}
/* 0/90/180/270度限定の厳密なcos/sin(Math.cos/sinの浮動小数誤差を避け、
   回転の往復で座標がわずかにずれるのを防ぐ) */
function cosDeg(d){ d = normRot(d); return d===0?1 : d===90?0 : d===180?-1 : 0; }
function sinDeg(d){ d = normRot(d); return d===0?0 : d===90?1 : d===180?0 : -1; }
/* 印刷範囲の回転が変わったとき、壁・オブジェクトの座標を「見た目の配置を保ったまま」
   新しい回転後のシート座標系に変換する。常にA3横基準(BASE_SHEET_W/H)の物理座標を
   経由することで、展示室図面の回転(render()内)と同じ考え方で一貫させている:
   1) 今の回転(fromRot)でのフレーム座標→物理座標(A3横基準)に戻す
   2) 物理座標→新しい回転(toRot)でのフレーム座標に変換する */
function remapPointForRotation(x, y, fromRot, toRot){
  if (normRot(fromRot) === normRot(toRot)) return [x, y];
  const [fw, fh] = sheetDimsForRot(fromRot);
  const [tw, th] = sheetDimsForRot(toRot);
  const fcx = fw/2, fcy = fh/2, tcx = tw/2, tcy = th/2;
  const fc = cosDeg(fromRot), fs = sinDeg(fromRot);
  // フレーム→物理(fromRotの逆回転)
  const ux = x - fcx, uy = y - fcy;
  const lx = ux*fc + uy*fs, ly = -ux*fs + uy*fc;
  const px = lx + BASE_SHEET_W/2, py = ly + BASE_SHEET_H/2;
  // 物理→新フレーム(toRotの順回転)
  const tc = cosDeg(toRot), ts = sinDeg(toRot);
  const plx = px - BASE_SHEET_W/2, ply = py - BASE_SHEET_H/2;
  return [Math.round(tcx + plx*tc - ply*ts), Math.round(tcy + plx*ts + ply*tc)];
}
/* 印刷範囲の回転が変わったとき、壁・作品・ケース・展示台・テキストなど
   配置済みのものすべてを新しい回転に合わせてまとめて回転させる
   (展示室図面は個別に持たず既にstate.sheet.rotで回転しているので対象外)。
   壁は始点・終点を remapPointForRotation で変換するだけで向きが保たれる。
   オブジェクトは位置に加えて obj.rot にも回転差分を足し、向き自体も回す */
function rotateContentWithSheet(fromRot, toRot){
  if (normRot(fromRot) === normRot(toRot)) return;
  const delta = normRot(toRot) - normRot(fromRot);
  for (const w of state.walls){
    [w.x1, w.y1] = remapPointForRotation(w.x1, w.y1, fromRot, toRot);
    [w.x2, w.y2] = remapPointForRotation(w.x2, w.y2, fromRot, toRot);
  }
  for (const o of state.objects){
    [o.x, o.y] = remapPointForRotation(o.x, o.y, fromRot, toRot);
    // obj.rotは90度単位に限らない任意角度なので、normRot()(90度に丸める)ではなく
    // 単純な0〜359の剰余で正規化する(rotateSelected()と同じ考え方)
    o.rot = ((((o.rot||0) + delta) % 360) + 360) % 360;
  }
}
/* 縮尺(0〜150%): 可動ケース・展示台の図面に対する表示サイズ倍率 */
function fsc(){ return Math.min(150, Math.max(0, state.scalePct ?? 100)) / 100; }

/* ---- ビュー(ズーム/パン) ---- */
/* 初期表示はシート+左右の在庫列(印刷範囲外)が見える範囲 */
let view = {x:-4400, y:-1000, w: SHEET.w+8800, h: SHEET.h+2000};
function fitView(){
  const m = Math.max(SHEET.w, SHEET.h) * 0.05;
  view = {x:-m, y:-m, w:SHEET.w+m*2, h:SHEET.h+m*2};
  applyView();
}
function applyView(){
  const el = svg.getBoundingClientRect();
  const ar = el.width / el.height;
  let {x,y,w,h} = view;
  if (w/h < ar) { const nw = h*ar; x -= (nw-w)/2; w = nw; }
  else { const nh = w/ar; y -= (nh-h)/2; h = nh; }
  svg.setAttribute("viewBox", `${x} ${y} ${w} ${h}`);
}
function zoom(f, cx, cy){
  const pt = clientToPlan(cx ?? innerWidth/2, cy ?? innerHeight/2);
  view.w *= f; view.h *= f;
  view.x = pt.x - (pt.x - view.x)*f;
  view.y = pt.y - (pt.y - view.y)*f;
  applyView(); render();
}
function clientToPlan(cx, cy){
  const p = svg.createSVGPoint(); p.x = cx; p.y = cy;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function snap(v){ return Math.round(v / (GRID/2)) * (GRID/2); }
const FINE = 50;            // 移動時の細かいスナップ(50mm)
/* 移動用スナップ: 通常は50mm刻み。Altキーでスナップ無し(1mm単位で自由に動かせる) */
function snapMove(v, free){ return free ? Math.round(v) : Math.round(v / FINE) * FINE; }
/* 縮尺を0%近くまで下げてもクリック/ドラッグで拾えるよう、表示上の最小サイズを保証する(mm) */
const MIN_DISP = 120;
/* ケース・展示台の表示上の幅・高さ(縮尺を反映しつつ最小表示サイズを保証) */
function dispSize(o){
  const f = fsc();
  return [Math.max(o.w*f, MIN_DISP), Math.max(o.h*f, MIN_DISP)];
}
/* オブジェクトの表示上の半幅・半高(縮尺を考慮)。整列・範囲選択の当たり判定に使う */
function halfExtent(o){
  if (o.type==="case" || o.type==="fixture"){ const [w,h] = dispSize(o); return [w/2, h/2]; }
  if (o.type==="work"){ return [o.w/2, o.h/2]; }
  return [0,0]; // text は点として扱う
}
/* 選択中のオブジェクトを整列/等間隔配置する。基準は選択全体のバウンディング */
function alignSelected(kind){
  const objs = state.objects.filter(o=>selectedIds.has(o.id));
  if (objs.length < 2) return;
  pushUndo();
  const ext = new Map(objs.map(o=>[o, halfExtent(o)]));
  const L = o=>o.x-ext.get(o)[0], R = o=>o.x+ext.get(o)[0];
  const T = o=>o.y-ext.get(o)[1], B = o=>o.y+ext.get(o)[1];
  const minL = Math.min(...objs.map(L)), maxR = Math.max(...objs.map(R));
  const minT = Math.min(...objs.map(T)), maxB = Math.max(...objs.map(B));
  if      (kind==="left")    objs.forEach(o=> o.x = minL + ext.get(o)[0]);
  else if (kind==="right")   objs.forEach(o=> o.x = maxR - ext.get(o)[0]);
  else if (kind==="hcenter") objs.forEach(o=> o.x = (minL+maxR)/2);
  else if (kind==="top")     objs.forEach(o=> o.y = minT + ext.get(o)[1]);
  else if (kind==="bottom")  objs.forEach(o=> o.y = maxB - ext.get(o)[1]);
  else if (kind==="vcenter") objs.forEach(o=> o.y = (minT+maxB)/2);
  else if (kind==="disth"){  // 中心を横方向に等間隔
    const s = [...objs].sort((a,b)=>a.x-b.x), step = (s[s.length-1].x - s[0].x)/(s.length-1);
    s.forEach((o,i)=> o.x = s[0].x + step*i);
  }
  else if (kind==="distv"){
    const s = [...objs].sort((a,b)=>a.y-b.y), step = (s[s.length-1].y - s[0].y)/(s.length-1);
    s.forEach((o,i)=> o.y = s[0].y + step*i);
  }
  render(); renderSide();
}
/* 選択中の作品・ケース・展示台・テキストをまとめて回転する。
   グループとして1つの軸周りに回すのではなく、各オブジェクトの位置(x,y)は
   そのままに、それぞれの向き(obj.rot)へ同じ角度を加算する
   (バラバラな向きの家具をまとめて90度直したい、という使い方を想定) */
function rotateSelected(deltaDeg){
  const objs = state.objects.filter(o=>selectedIds.has(o.id));
  if (!objs.length) return;
  pushUndo();
  objs.forEach(o=> o.rot = ((((o.rot||0) + deltaDeg) % 360) + 360) % 360);
  render(); renderSide();
}
/* 既存の壁の端点が近くにあればそこへ吸着(壁の連結)。なければグリッドスナップ */
function snapWallPoint(p, excludeId){
  const R = 400; // 吸着半径(mm)
  let best = null, bd = R;
  for (const w of state.walls){
    if (w.id === excludeId) continue;
    for (const [ex,ey] of [[w.x1,w.y1],[w.x2,w.y2]]){
      const d = Math.hypot(p.x-ex, p.y-ey);
      if (d < bd){ bd = d; best = {x:ex, y:ey, joined:true}; }
    }
  }
  return best || {x:snap(p.x), y:snap(p.y), joined:false};
}
function today(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }

/* ---- 履歴 ----
   画像(state.library / state.images / rooms.img / objects.img)はサイズが大きいので
   履歴から除外し、Undo/Redoをまたいで現在の画像を維持する
   (画像フォルダへの追加・削除自体は履歴で戻らない。一方で作品への画像の割り当ては
   obj.imgId という短い文字列なので通常どおりUndoできる) */
function snapshot(){
  return JSON.stringify(state, (k,v)=> (k==="images" || k==="img" || k==="library") ? undefined : v);
}
function applySnapshot(json){
  const images = state.images || {};
  const library = state.library || [];
  const roomImgs = {}; for (const r of state.rooms?.list||[]) roomImgs[r.id] = r.img;
  const objImgs = {};  for (const o of state.objects||[]) if (o.img) objImgs[o.id] = o.img;
  state = JSON.parse(json);
  state.images = images;
  state.library = library;
  for (const r of state.rooms?.list||[]) if (r.id in roomImgs) r.img = roomImgs[r.id];
  for (const o of state.objects||[]) if (objImgs[o.id]) o.img = objImgs[o.id];
}
function pushUndo(){
  undoStack.push(snapshot());
  if (undoStack.length > 50) undoStack.shift();
  redoStack.length = 0; // 新しい操作でやり直し履歴は無効になる
}
function undo(){
  if (!undoStack.length) return;
  redoStack.push(snapshot());
  applySnapshot(undoStack.pop());
  afterHistory();
}
function redo(){
  if (!redoStack.length) return;
  undoStack.push(snapshot());
  applySnapshot(redoStack.pop());
  afterHistory();
}
function afterHistory(){
  clearSelect(); syncSheetUI(); render(); renderSide();
}

/* ---- 描画 ---- */
function el(name, attrs, parent){
  const e = document.createElementNS(SVG_NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

/* 背景つきケースの表現: 長辺(幅の側)のうち1本を通常の3倍の太さで描く。
   ケースは幅w×奥行hで、長辺は幅の側。奥(上端)を背景板と見なして太くする */
function drawBackEdge(g, w, h, col, baseWidth=25){
  el("line",{x1:-w/2, y1:-h/2, x2:w/2, y2:-h/2,
    stroke:col, "stroke-width":baseWidth*3, "stroke-linecap":"square"}, g);
}

function render(){
  svg.innerHTML = "";

  // 描画物はすべてこのグループに入れる。印刷時だけ@media printでsheetClipを掛け、
  // 印刷範囲の外にあるもの(在庫パレットや範囲外に置いたケース等)が用紙に
  // 写り込まないようにする(画面編集中はクリップしないので範囲外も自由に置ける)
  const defs = el("defs",{}, svg);
  const cp = el("clipPath",{id:"sheetClip"}, defs);
  el("rect",{x:0,y:0,width:SHEET.w,height:SHEET.h}, cp);
  const root = el("g",{class:"sheet-root"}, svg);

  // 用紙
  el("rect",{x:0,y:0,width:SHEET.w,height:SHEET.h,fill:"var(--paper)",stroke:"var(--ink)","stroke-width":30}, root);

  // グリッド
  const g = el("g",{}, root);
  for (let x=0; x<=SHEET.w; x+=GRID)
    el("line",{x1:x,y1:0,x2:x,y2:SHEET.h,stroke: x%(GRID*4)?"var(--grid)":"var(--grid-major)","stroke-width":x%(GRID*4)?6:10}, g);
  for (let y=0; y<=SHEET.h; y+=GRID)
    el("line",{x1:0,y1:y,x2:SHEET.w,y2:y,stroke: y%(GRID*4)?"var(--grid)":"var(--grid-major)","stroke-width":y%(GRID*4)?6:10}, g);

  // 展示室図面(最背面レイヤー)。回転は印刷範囲(state.sheet.rot)と共通の1つの値を使い、
  // 個別には設定させない(「印刷範囲と図面を個別に回転させない」)。
  // 画像の基準サイズは常にA3横基準(BASE_SHEET_W/H)で固定し、印刷範囲と同じ角度だけ
  // 回転させることで、90/270度でも回転後の見た目の縦横比が印刷範囲と自動的に一致する。
  // 回転の中心は「印刷範囲の中心」に合わせるので、位置(dx,dy)を0のままにしておけば
  // 回転させても図面は常に印刷範囲の中央にきれいに収まる
  const room = state.rooms?.list.find(r=>r.id===state.rooms.current);
  if (layerVis.room && room?.img){
    const rot = normRot(state.sheet?.rot);
    const rw = BASE_SHEET_W*(room.scale??100)/100, rh = BASE_SHEET_H*(room.scale??100)/100;
    const rx = SHEET.w/2 - rw/2 + (room.dx||0), ry = SHEET.h/2 - rh/2 + (room.dy||0);
    el("image",{href:room.img, x:rx, y:ry, width:rw, height:rh,
      preserveAspectRatio:"xMinYMin meet", opacity:(room.op??70)/100,
      transform: rot ? `rotate(${rot} ${rx+rw/2} ${ry+rh/2})` : "",
      "pointer-events":"none"}, root);
  }

  // 壁
  for (const w of state.walls){
    const ln = el("line",{x1:w.x1,y1:w.y1,x2:w.x2,y2:w.y2,"stroke-width":WALL_T,class:"wall-line","data-id":w.id}, root);
    if (selectedIds.has(w.id)) ln.style.stroke = "var(--accent)"; // inline styleでCSSクラスに勝たせる
  }

  // 在庫パレット(印刷範囲の外): ケースは左・展示台は右に種類ごと1つ+使用数/残数を縦一列で表示。
  // クリック(ドラッグ)で1台取り出す。残0以下はグレー表示(取りすぎはマイナス表示で警告)
  const f = fsc();
  if (layerVis.furniture){
    let ly = 400, ry = 400;
    const GAPP = 620; // 使用数の行を足したぶん間隔を広げる
    for (const s of state.stock){
      const remain = stockRemain(s.key), used = stockUsed(s.key), elsewhere = stockElsewhere(s.key);
      const isCase = s.cat === "case";
      const [w,h] = dispSize(s);
      const x = isCase ? -2400 : SHEET.w + 2400;
      const y = (isCase ? ly : ry) + h/2;
      const col = isCase ? "var(--case)" : "var(--fixture)";
      const g = el("g",{class:"stock"+(remain>0?"":" empty"),"data-stock":s.key,
        transform:`translate(${x},${y})`}, root);
      el("rect",{x:-w/2,y:-h/2,width:w,height:h,fill:col,"fill-opacity":remain>0?.18:.05,
        stroke:col,"stroke-width":25,"stroke-dasharray":remain>0?"":"120 80"}, g);
      if (s.back) drawBackEdge(g, w, h, col); // 背景つきは長辺の1本を太線で
      const lbl = el("text",{class:"lbl stock-name","font-size":240,y:-40}, g);
      lbl.textContent = s.name;
      // この図面での使用数(+他図面での使用数があれば併記)
      const useT = el("text",{class:"lbl stock-used","font-size":200,y:230,fill:"#6d6a60"}, g);
      useT.textContent = elsewhere ? `使用 ${used} (他 ${elsewhere})` : `使用 ${used}`;
      const cnt = el("text",{class:"lbl stock-remain","font-size":220,y:470,
        fill:remain>0?"var(--accent)":(remain<0?"#c33":"#999"),"font-weight":600}, g);
      cnt.textContent = `残 ${remain} / ${s.total}`;
      if (isCase) ly += h + GAPP; else ry += h + GAPP;
    }
  }

  // オブジェクト: レイヤー順(ケース・展示台 → 作品 → テキスト)に描画。安定ソートなので同レイヤー内は配列順
  const layerShown = o => [layerVis.furniture, layerVis.work, layerVis.text][layerOf(o)];
  for (const o of [...state.objects].sort((a,b)=>layerOf(a)-layerOf(b))){
    if (!layerShown(o)) continue;
    const grp = el("g",{class:"obj"+(selectedIds.has(o.id)?" selected":""),"data-id":o.id,
      transform:`translate(${o.x},${o.y}) rotate(${o.rot||0})`}, root);

    if (o.type === "work"){
      el("rect",{class:"body",x:-o.w/2,y:-o.h/2,width:o.w,height:o.h,fill:"#fff",stroke:"var(--ink)","stroke-width":20}, grp);
      const img = workImage(o);
      if (img)
        el("image",{href:img,x:-o.w/2,y:-o.h/2,width:o.w,height:o.h,
          preserveAspectRatio:"xMidYMid meet","pointer-events":"none"}, grp);
      else
        el("line",{x1:-o.w/2,y1:o.h/2,x2:o.w/2,y2:-o.h/2,stroke:"#bbb","stroke-width":10}, grp);
      // 図面上は「番号」のみ表示(作品名等は出さない)
      const b = el("g",{class:"badge",transform:`translate(0,${-o.h/2-260})`}, grp);
      const bw = Math.max(400, String(o.no??"").length*130 + 160);
      el("rect",{x:-bw/2,y:-200,width:bw,height:400,rx:200,fill:"var(--accent)"}, b);
      const t = el("text",{}, b); t.textContent = o.no ?? "";
      t.setAttribute("font-size", 220);
    }
    else if (o.type === "case" || o.type === "fixture"){
      const [w,h] = dispSize(o); // 縮尺(0〜150%)を反映。0%近くでも最小表示サイズ(MIN_DISP)は保証する
      const col = o.type === "case" ? "var(--case)" : "var(--fixture)";
      el("rect",{class:"body",x:-w/2,y:-h/2,width:w,height:h,fill:col,
        "fill-opacity":o.type==="case"?.18:.25,stroke:col,"stroke-width":o.type==="case"?25:20}, grp);
      if (isBackCase(o)) drawBackEdge(grp, w, h, col); // 背景つきケースは長辺の1本を太線で
      const lbl = el("text",{class:"lbl","font-size":Math.max(120, 240*f)}, grp);
      lbl.textContent = o.label || (o.type==="case"?"ケース":"展示台");
    }
    else if (o.type === "text"){
      const t = el("text",{class:"lbl body","font-size":320,"font-weight":600}, grp);
      t.textContent = o.label || "テキスト";
      el("rect",{x:-800,y:-260,width:1600,height:520,fill:"transparent"}, grp); // クリック領域
    }
  }

  applyView();
}

function fld(label,key,val){
  return `<div class="field"><label>${label}</label><input data-key="${key}" value="${esc(val||"")}"></div>`;
}
function esc(s){ return String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

/* ---- 作品リスト(CSV)・作品画像の読み込み ---- */
/* 番号の正規化: 全角数字→半角にして数字部分を取り出す(先頭ゼロは落とす)。
   作品リストの「番号」とファイル名(例: 10001.jpg)をこれで対応付ける */
function normNo(v){
  const s = String(v??"").replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0));
  const m = s.match(/\d+/);
  return m ? String(+m[0]) : "";
}
/* Excel書き出しのCSVはShift_JISが多いため、UTF-8で化けたら読み直す */
async function decodeText(file){
  const buf = await file.arrayBuffer();
  let t = new TextDecoder("utf-8").decode(buf);
  if (t.includes("�")) t = new TextDecoder("shift_jis").decode(buf);
  return t;
}
function splitLine(line, sep){
  const out = []; let cur = "", q = false;
  for (let i=0;i<line.length;i++){
    const ch = line[i];
    if (q){ if (ch === '"'){ if (line[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep){ out.push(cur); cur = ""; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}
function parseWorkList(text){
  const sep = text.includes("\t") ? "\t" : ",";
  const rows = text.split(/\r?\n/).filter(l=>l.trim()).map(l=>splitLine(l, sep).map(c=>c.trim()));
  if (!rows.length) return [];
  let noI = 0, titleI = 1, artistI = -1, start = 0;
  const head = rows[0];
  if (head.some(c=>/番号|作品名|タイトル|題名|作家|作者|^No\.?$/i.test(c))){
    start = 1;
    const n = head.findIndex(c=>/番号|^No\.?$|^NO$/i.test(c)); if (n >= 0) noI = n;
    const t = head.findIndex(c=>/作品名|タイトル|題名/.test(c));  if (t >= 0) titleI = t;
    const a = head.findIndex(c=>/作家|作者/.test(c));            if (a >= 0) artistI = a;
  }
  const list = [];
  for (const r of rows.slice(start)){
    const no = normNo(r[noI]);
    if (!no) continue;
    list.push({no, title: r[titleI] ?? "", artist: artistI >= 0 ? (r[artistI] ?? "") : ""});
  }
  return list;
}
/* 画像を長辺maxEdge px・JPEGに圧縮してdataURL化する。
   スキャン画像やスマホ写真はそのまま読み込むと数千px×数十MBのdataURLになり、
   render()は毎回SVGを作り直す(=毎フレームhrefを再デコード)ため、
   圧縮せず生のdataURLを使うと操作中にブラウザがフリーズする。
   必ずこの関数を通してからstateに保存すること */
function compressImage(file, maxEdge=512, quality=0.72){
  return new Promise((res, rej)=>{
    const img = new Image();
    img.onload = ()=>{
      const r = Math.min(1, maxEdge/Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width*r));
      c.height = Math.max(1, Math.round(img.height*r));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL("image/jpeg", quality));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(img.src); rej(new Error("画像を開けません(壊れているか、画像ファイルではない可能性があります)")); };
    img.src = URL.createObjectURL(file);
  });
}
/* 展示室図面は拡大して見る前提のため作品サムネイルより高い解像度で圧縮する */
function compressRoomImage(file){ return compressImage(file, 3000, 0.85); }

function deleteSelected(){
  if (!selectedIds.size) return;
  pushUndo();
  state.objects = state.objects.filter(o=>!selectedIds.has(o.id));
  state.walls = state.walls.filter(w=>!selectedIds.has(w.id));
  clearSelect(); render(); renderSide();
}

/* ---- ポインタ操作 ---- */
let drag = null; // {mode:'wall'|'move'|'pan', ...}
const pointers = new Map(); // アクティブなポインタ(ピンチズーム判定用)
let pinch = null;           // {d,cx,cy} 直前フレームの2本指間距離と中点
let lastTap = {id:null, t:0}; // 自前のダブルクリック判定用(直前に押したオブジェクトと時刻)

/* ---- 壁のコピー&ペースト(Ctrl+C / Ctrl+V) ---- */
const PASTE_OFFSET = 500; // 貼り付けるたびに少しずらす量(mm)。原本にぴったり重ならないように
let wallClipboard = [];   // コピーした壁の形状(x1,y1,x2,y2の相対配置をそのまま保持)
let pasteCount = 0;       // 同じコピー内容から連続で貼り付けた回数(ずらし幅に使う)
function copySelectedWalls(){
  const walls = state.walls.filter(w=>selectedIds.has(w.id));
  if (!walls.length) return;
  wallClipboard = walls.map(w=>({x1:w.x1, y1:w.y1, x2:w.x2, y2:w.y2}));
  pasteCount = 0;
}
function pasteWalls(){
  if (!wallClipboard.length) return;
  pasteCount++;
  const off = PASTE_OFFSET * pasteCount;
  pushUndo();
  const newIds = [];
  for (const w of wallClipboard){
    const nw = {id:idSeq++, x1:w.x1+off, y1:w.y1+off, x2:w.x2+off, y2:w.y2+off};
    state.walls.push(nw);
    newIds.push(nw.id);
  }
  selectedIds = new Set(newIds); selectedId = newIds[newIds.length-1]; // 貼り付けたものを選択状態にする
  render(); renderSide();
}

svg.addEventListener("pointerdown", ev=>{
  svg.setPointerCapture(ev.pointerId);
  pointers.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
  if (pointers.size === 2){
    // 2本目の指が触れたらピンチ開始。描きかけの壁は破棄する
    if (drag?.mode === "wall"){ state.walls.pop(); undoStack.pop(); render(); }
    drag = null;
    const [p1,p2] = [...pointers.values()];
    pinch = {d: Math.hypot(p1.x-p2.x, p1.y-p2.y), cx:(p1.x+p2.x)/2, cy:(p1.y+p2.y)/2};
    return;
  }
  if (pointers.size > 2) return;
  const p = clientToPlan(ev.clientX, ev.clientY);
  const hit = ev.target.closest("[data-id]");

  // 在庫パレットから1台取り出す(残数が減る)。そのままドラッグで配置できる
  const stockHit = ev.target.closest("[data-stock]");
  if (stockHit && tool !== "erase"){
    const s = state.stock.find(t=>t.key===stockHit.dataset.stock);
    if (s && stockRemain(s.key) > 0){
      pushUndo();
      const o = {id:idSeq++, type:s.cat==="case"?"case":"fixture", stockKey:s.key,
        x:snap(p.x), y:snap(p.y), rot:0, w:s.w, h:s.h, label:s.name};
      state.objects.push(o);
      selectOnly(o.id);
      setTool("select");
      drag = {mode:"move", start:{x:p.x,y:p.y}, items:[{obj:o, ox:o.x, oy:o.y}], primary:{obj:o, ox:o.x, oy:o.y}};
      render(); renderSide();
    }
    return;
  }

  // 作品をダブルクリック(タッチならダブルタップ) → 画像フォルダから画像を選ぶ。
  // render()がpointerdownのたびにSVGを作り直す(=down時とup時で要素が別物になる)ため、
  // ブラウザのclick/dblclickイベントは発火しない。そこで自前で二度押しを判定する
  if (tool === "select" && hit){
    const hitId = +hit.dataset.id;
    const now = Date.now();
    if (lastTap.id === hitId && now - lastTap.t < 400){
      const o = state.objects.find(x=>x.id === hitId);
      if (o && o.type === "work"){
        lastTap = {id:null, t:0};
        drag = null; // 1回目のクリックで始まっていた移動を打ち切る
        selectOnly(o.id); render(); renderSide();
        openLibrary(o);
        return;
      }
    }
    lastTap = {id: hitId, t: now};
  }

  if (tool === "wall"){
    pushUndo();
    const sp = snapWallPoint(p);
    const w = {id: idSeq++, x1:sp.x, y1:sp.y, x2:sp.x, y2:sp.y};
    state.walls.push(w);
    drag = {mode:"wall", wall:w};
    return;
  }
  if (tool === "work"){
    pushUndo();
    // 作品リストの未配置の先頭番号を自動で割り当てる(リストが無ければ連番)
    const used = new Set(state.objects.filter(o=>o.type==="work").map(o=>String(o.no)));
    let no = state.workList.find(w=>!used.has(String(w.no)))?.no;
    if (no == null){
      const nums = [...used].map(Number).filter(n=>!isNaN(n));
      no = (nums.length ? Math.max(...nums) : 0) + 1;
    }
    const o = {id:idSeq++, type:"work", no, x:snap(p.x), y:snap(p.y), rot:0, w:1200, h:900};
    state.objects.push(o);
    selectOnly(o.id);
    setTool("select");
    render(); renderSide();
    return;
  }
  if (tool === "text"){
    pushUndo();
    const o = {id:idSeq++, type:"text", x:snap(p.x), y:snap(p.y), rot:0, w:0, h:0, label:"テキスト"};
    state.objects.push(o);
    selectOnly(o.id);
    setTool("select");
    render(); renderSide();
    return;
  }
  if (tool === "erase"){
    if (hit){ selectOnly(+hit.dataset.id); deleteSelected(); }
    return;
  }
  // select / 複数選択 / 移動
  const multiKey = ev.shiftKey || ev.ctrlKey || ev.metaKey;
  if (hit){
    const id = +hit.dataset.id;
    if (multiKey){
      // 選択に追加/除外(ドラッグ移動はしない)
      toggleSelect(id);
      render(); renderSide();
    } else {
      // 未選択のものをクリックしたら単独選択。選択済みならグループ全体をドラッグ
      if (!selectedIds.has(id)) selectOnly(id);
      pushUndo();
      const items = [];       // 移動対象のオブジェクト {obj, ox, oy}
      const wallItems = [];   // 移動対象の壁(始点・終点をまとめて平行移動) {wall, ox1,oy1,ox2,oy2, ox,oy}
      let primary = null;     // ドラッグ量の基準点(オブジェクト・壁共通で {ox,oy} を持つ)
      for (const o of state.objects){
        if (!selectedIds.has(o.id)) continue;
        const it = {obj:o, ox:o.x, oy:o.y};
        items.push(it);
        if (o.id === id) primary = it;
      }
      for (const w of state.walls){
        if (!selectedIds.has(w.id)) continue;
        const it = {wall:w, ox1:w.x1, oy1:w.y1, ox2:w.x2, oy2:w.y2, ox:w.x1, oy:w.y1};
        wallItems.push(it);
        if (w.id === id) primary = it;
      }
      if (primary) drag = {mode:"move", start:{x:p.x,y:p.y}, items, wallItems, primary};
      render(); renderSide();
    }
  } else if (multiKey){
    // 空白をShift/Ctrl+ドラッグ → 範囲選択(マーキー)
    drag = {mode:"marquee", x0:p.x, y0:p.y, add:selectedIds};
  } else {
    clearSelect();
    drag = {mode:"pan", sx:ev.clientX, sy:ev.clientY, view:{...view}};
    render(); renderSide();
  }
});

svg.addEventListener("pointermove", ev=>{
  if (pointers.has(ev.pointerId)) pointers.set(ev.pointerId, {x:ev.clientX, y:ev.clientY});
  if (pinch && pointers.size >= 2){
    const [p1,p2] = [...pointers.values()];
    const d = Math.hypot(p1.x-p2.x, p1.y-p2.y);
    const cx = (p1.x+p2.x)/2, cy = (p1.y+p2.y)/2;
    if (d > 0 && pinch.d > 0) zoom(pinch.d / d, cx, cy); // 指を広げる→拡大
    const scale = view.w / svg.getBoundingClientRect().width;
    view.x -= (cx - pinch.cx) * scale;
    view.y -= (cy - pinch.cy) * scale;
    applyView();
    pinch = {d, cx, cy};
    return;
  }
  if (!drag) return;
  const p = clientToPlan(ev.clientX, ev.clientY);
  if (drag.mode === "wall"){
    const sp = snapWallPoint(p, drag.wall.id);
    let x2 = sp.x, y2 = sp.y;
    if (!sp.joined && !ev.shiftKey){ // 端点連結時以外は直交スナップ、Shiftで自由角度
      if (Math.abs(x2-drag.wall.x1) > Math.abs(y2-drag.wall.y1)) y2 = drag.wall.y1;
      else x2 = drag.wall.x1;
    }
    drag.wall.x2 = x2; drag.wall.y2 = y2;
    render();
  }
  else if (drag.mode === "move"){
    // 主選択を50mm(Altでフリー)スナップし、その移動量を選択全体へ適用
    const pr = drag.primary;
    const nx = snapMove(pr.ox + (p.x - drag.start.x), ev.altKey);
    const ny = snapMove(pr.oy + (p.y - drag.start.y), ev.altKey);
    const dx = nx - pr.ox, dy = ny - pr.oy;
    for (const it of drag.items){ it.obj.x = it.ox + dx; it.obj.y = it.oy + dy; }
    for (const it of drag.wallItems || []){
      it.wall.x1 = it.ox1 + dx; it.wall.y1 = it.oy1 + dy;
      it.wall.x2 = it.ox2 + dx; it.wall.y2 = it.oy2 + dy;
    }
    render();
  }
  else if (drag.mode === "marquee"){
    drag.x1 = p.x; drag.y1 = p.y;
    render();
    const x = Math.min(drag.x0, p.x), y = Math.min(drag.y0, p.y);
    el("rect",{x, y, width:Math.abs(p.x-drag.x0), height:Math.abs(p.y-drag.y0),
      fill:"var(--accent)","fill-opacity":.08, stroke:"var(--accent)","stroke-width":30,
      "stroke-dasharray":"120 90","pointer-events":"none"}, svg);
  }
  else if (drag.mode === "pan"){
    const scale = view.w / svg.getBoundingClientRect().width;
    view.x = drag.view.x - (ev.clientX - drag.sx)*scale;
    view.y = drag.view.y - (ev.clientY - drag.sy)*scale;
    applyView();
  }
});

svg.addEventListener("pointerup", ev=>{
  pointers.delete(ev.pointerId);
  if (pointers.size < 2) pinch = null;
  if (drag?.mode === "wall"){
    const w = drag.wall;
    if (w.x1===w.x2 && w.y1===w.y2){ state.walls.pop(); undoStack.pop(); } // 長さ0は破棄
    render();
  }
  else if (drag?.mode === "marquee"){
    // 範囲に中心が入るオブジェクトを選択(既存選択に追加)
    if (drag.x1 != null){
      const x0 = Math.min(drag.x0, drag.x1), x1 = Math.max(drag.x0, drag.x1);
      const y0 = Math.min(drag.y0, drag.y1), y1 = Math.max(drag.y0, drag.y1);
      for (const o of state.objects){
        if (!layerVis[["furniture","work","text"][layerOf(o)]]) continue;
        if (o.x>=x0 && o.x<=x1 && o.y>=y0 && o.y<=y1){ selectedIds.add(o.id); selectedId = o.id; }
      }
    }
    render(); renderSide();
  }
  drag = null;
});
svg.addEventListener("pointercancel", ev=>{
  pointers.delete(ev.pointerId);
  if (pointers.size < 2) pinch = null;
  drag = null;
});

svg.addEventListener("wheel", ev=>{
  ev.preventDefault();
  zoom(ev.deltaY > 0 ? 1.1 : 0.9, ev.clientX, ev.clientY);
},{passive:false});

/* ---- ツール切替 ---- */
function setTool(t){
  tool = t;
  document.querySelectorAll(".tool").forEach(b=>b.classList.toggle("active", b.dataset.tool===t));
  const hints = {
    select:"クリック選択/ドラッグ移動(50mm刻み、Altで自由)。Shift+クリックで複数選択、Shift+空白ドラッグで範囲選択→整列",
    wall:"ドラッグで壁を描画(Shiftで自由角度、既存の壁の端点に近づけると連結)",
    work:"クリックで作品を配置(作品リストの未配置の番号が自動で付きます)",
    text:"クリックでテキストを配置",
    erase:"クリックしたオブジェクトを削除(ケース・展示台は在庫に戻ります)"
  };
  document.getElementById("hint").textContent = hints[t];
}
document.querySelectorAll(".tool").forEach(b=> b.onclick = ()=> setTool(b.dataset.tool));

/* ---- レイヤー表示切替 ---- */
document.querySelectorAll("#layerBar input").forEach(cb=>{
  cb.onchange = ()=>{ layerVis[cb.dataset.layer] = cb.checked; render(); };
});

/* ---- キーボード ---- */
window.addEventListener("keydown", ev=>{
  if (ev.target.matches("input,textarea")) return;
  // モーダルを開いている間はEscapeで閉じるだけ(図面側の操作は受け付けない)
  if (!document.getElementById("libModal").hidden){
    if (ev.key==="Escape"){ ev.preventDefault(); closeLibrary(); }
    return;
  }
  if (!document.getElementById("stockModal").hidden){
    if (ev.key==="Escape"){ ev.preventDefault(); closeStock(); }
    return;
  }
  if ((ev.ctrlKey||ev.metaKey) && ev.key.toLowerCase()==="z" && !ev.shiftKey){ ev.preventDefault(); undo(); }
  else if ((ev.ctrlKey||ev.metaKey) && (ev.key.toLowerCase()==="y" || (ev.key.toLowerCase()==="z" && ev.shiftKey))){ ev.preventDefault(); redo(); }
  else if ((ev.ctrlKey||ev.metaKey) && ev.key.toLowerCase()==="a"){ // 全オブジェクト選択
    ev.preventDefault();
    selectedIds = new Set(state.objects.filter(o=>layerVis[["furniture","work","text"][layerOf(o)]]).map(o=>o.id));
    selectedId = [...selectedIds].pop() ?? null;
    render(); renderSide();
  }
  else if ((ev.ctrlKey||ev.metaKey) && ev.key.toLowerCase()==="c"){ ev.preventDefault(); copySelectedWalls(); }
  else if ((ev.ctrlKey||ev.metaKey) && ev.key.toLowerCase()==="v"){ ev.preventDefault(); pasteWalls(); }
  else if (ev.key==="Delete" || ev.key==="Backspace"){ deleteSelected(); }
  else if (ev.key==="Escape"){ clearSelect(); setTool("select"); render(); renderSide(); }
});

/* ---- 保存 / 読み込み / 書き出し ---- */
document.getElementById("saveBtn").onclick = ()=>{
  // 保存日はページを開いた時刻でも読み込んだファイルの値でもなく、
  // 「今まさに保存した日」でなければならない(ファイル名にも入る)
  state.meta.date = today();
  const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${state.meta.title||"floorplan"}_${state.meta.date}.json`;
  a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById("loadBtn").onclick = ()=> document.getElementById("fileInput").click();
document.getElementById("fileInput").onchange = async ev=>{
  const f = ev.target.files[0]; if (!f) return;
  try{
    const data = JSON.parse(await f.text());
    if (!data.walls || !data.objects) throw new Error("形式が違います");
    pushUndo();
    state = data;
    // 旧形式JSONとの互換
    if (state.sheet?.rot != null) state.sheet = {rot: normRot(state.sheet.rot)};
    else if (state.sheet?.preset) state.sheet = {rot: /p$/.test(state.sheet.preset) ? 90 : 0}; // a3l/a4l→0°, a3p/a4p→90°
    else state.sheet = {rot: 0};
    if (!state.rooms) state.rooms = defaultRooms();
    // 旧形式(rot:0/90/180/270を個別に持つ展示室図面)を読み込んでも、回転は
    // 印刷範囲(state.sheet.rot)側に一本化したため r.rot の値は無視してよい
    if (state.scalePct == null) state.scalePct = 100; // 0%も有効な値なので !state.scalePct にしない
    if (!state.workList) state.workList = [];
    if (!state.images) state.images = {};
    // 画像フォルダ。旧形式(番号→dataURLのstate.imagesだけを持つファイル)は
    // ここでlibraryへ移して、以後は画像フォルダから選べるようにする
    if (!Array.isArray(state.library)) state.library = [];
    libSeq = 1;
    for (const it of state.library){
      const n = +String(it.id||"").replace(/\D/g, "");
      if (n >= libSeq) libSeq = n + 1;
    }
    for (const [no, img] of Object.entries(state.images)){
      if (!img || state.library.some(it=>it.no === no)) continue;
      addToLibrary(`${no}.jpg`, img);
    }
    // 在庫(可動ケース・展示台)の総数はアプリ側の設定であり、ファイルごとに
    // 保存された古い総数を引きずらないよう、読み込み時は常に現在のdefaultStock()で
    // 上書きする(総数を変更しても、既存の保存ファイルを開くと反映されない不具合の修正)。
    // 配置済みオブジェクトはstockKeyだけを見て残数を数え直すので、この上書きに
    // 追従できないデータが混ざる心配はない
    state.stock = defaultStock();
    // 他の展示室での使用台数(在庫パネルの手入力)は図面ごとの情報なので保存値をそのまま使う
    if (!state.usedElsewhere || typeof state.usedElsewhere !== "object") state.usedElsewhere = {};
    idSeq = Math.max(0, ...state.walls.map(w=>w.id), ...state.objects.map(o=>o.id)) + 1;
    clearSelect(); syncSheetUI(); render(); renderSide();
  }catch(e){ alert("読み込みに失敗しました: " + e.message); }
  ev.target.value = "";
};
document.getElementById("pngBtn").onclick = ()=>{
  const clone = svg.cloneNode(true);
  clone.setAttribute("viewBox", `-300 -300 ${SHEET.w+600} ${SHEET.h+600}`);
  clone.setAttribute("width", 2400);
  clone.setAttribute("height", Math.round(2400*SHEET.h/SHEET.w));
  // 外部CSSはシリアライズされないため、必要なスタイルをSVG内に埋め込む
  const css = getComputedStyle(document.documentElement);
  const v = name => css.getPropertyValue(name).trim();
  const styleTag = document.createElementNS(SVG_NS, "style");
  styleTag.textContent = `
    .wall-line{stroke:${v("--wall")};stroke-linecap:square}
    .badge circle{fill:${v("--accent")}}
    .badge text{fill:#fff;font-weight:600;text-anchor:middle;dominant-baseline:central}
    .obj text.lbl{fill:${v("--ink")};text-anchor:middle}
    text{font-family:sans-serif}`;
  clone.insertBefore(styleTag, clone.firstChild);
  let str = new XMLSerializer().serializeToString(clone);
  for (const v of ["--paper","--ink","--grid","--grid-major","--accent","--wall","--fixture","--case"])
    str = str.replaceAll(`var(${v})`, css.getPropertyValue(v).trim());
  str = str.replace("<svg", `<svg style="font-family:sans-serif"`);
  const img = new Image();
  img.onload = ()=>{
    const c = document.createElement("canvas");
    c.width = 2400; c.height = Math.round(2400*SHEET.h/SHEET.w);
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(img,0,0,c.width,c.height);
    const a = document.createElement("a");
    a.href = c.toDataURL("image/png");
    a.download = `${state.meta.title||"floorplan"}.png`;
    a.click();
  };
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(str);
};
document.getElementById("printBtn").onclick = ()=>{
  const prev = {...view};
  // 用紙の向きを印刷範囲(A3横/縦)に合わせ、余白0にすることで紙いっぱいに出す
  document.getElementById("pageStyle").textContent =
    `@page{size:A3 ${SHEET.w >= SHEET.h ? "landscape" : "portrait"};margin:0}`;
  // applyView()は画面の縦横比に合わせてviewBoxを左右(上下)に広げるため、
  // そのまま印刷すると印刷範囲の外にある在庫パレット等まで用紙に写り込む。
  // 印刷時は印刷範囲そのものをviewBoxにして、紙に等倍で収まるようにする
  view = {x:0, y:0, w:SHEET.w, h:SHEET.h};
  svg.setAttribute("viewBox", `0 0 ${SHEET.w} ${SHEET.h}`);
  window.print();
  view = prev; applyView();
};
document.getElementById("sheetSel").onchange = ev=>{
  pushUndo();
  const fromRot = normRot(state.sheet?.rot), toRot = normRot(+ev.target.value);
  rotateContentWithSheet(fromRot, toRot); // 壁・作品・ケース・展示台・テキストもまとめて回転
  state.sheet = {rot: toRot};
  applySheet(); fitView(); render(); renderSide();
};
document.getElementById("scalePct").onchange = ev=>{
  pushUndo();
  // 0%も有効な値なので "||" ではなくNaN判定で無効値のみ100にフォールバックする
  const v = +ev.target.value;
  state.scalePct = Math.min(150, Math.max(0, Math.round(isNaN(v) ? 100 : v)));
  ev.target.value = state.scalePct;
  render();
};

/* 作品リスト(CSV)の読み込み */
document.getElementById("wlBtn").onclick = ()=> document.getElementById("wlInput").click();
document.getElementById("wlInput").onchange = async ev=>{
  const f = ev.target.files[0]; if (!f) return;
  try{
    const list = parseWorkList(await decodeText(f));
    if (!list.length) throw new Error("「番号」の列が見つかりません(1列目か「番号」列に数字を入れてください)");
    pushUndo();
    state.workList = list;
    render(); renderSide();
    document.getElementById("hint").textContent = `作品リスト ${list.length}件を読み込みました`;
  }catch(e){ alert("作品リストの読み込みに失敗しました: " + e.message); }
  ev.target.value = "";
};

/* ---- 画像フォルダ(モーダル) ----
   pickTarget が null なら「一覧・管理」モード、作品オブジェクトなら「その作品に
   割り当てる画像を選ぶ」モード(図面上でダブルクリックしたとき) */
let pickTarget = null;
function openLibrary(target){
  pickTarget = target || null;
  document.getElementById("libModal").hidden = false;
  renderLibrary();
}
function closeLibrary(){
  pickTarget = null;
  document.getElementById("libModal").hidden = true;
}
function renderLibrary(){
  const grid = document.getElementById("libGrid");
  const picking = !!pickTarget;
  document.getElementById("libTitle").innerHTML = picking
    ? `作品 <b style="color:var(--accent)">${esc(pickTarget.no ?? "")}</b> に使う画像を選ぶ <span class="sub">(クリックで決定)</span>`
    : `画像フォルダ <span class="sub">(ここに入れた画像は図面と一緒に保存されます)</span>`;
  document.getElementById("libClear").hidden = !picking;
  document.getElementById("libNote").textContent = picking
    ? "画像フォルダに入っている画像から選べます"
    : `${state.library.length}件。図面上の作品をダブルクリックすると、ここから画像を選べます`;

  if (!state.library.length){
    grid.innerHTML = `<div class="empty">画像フォルダは空です。<br>
      「＋ 画像を追加」から画像をまとめて入れておくと、図面上の作品を<br>
      ダブルクリックして選べるようになります。<br>
      ファイル名を作品番号(例: 10001.jpg)にしておくと、その番号の作品に自動で対応します。</div>`;
    return;
  }
  const curId = picking ? pickTarget.imgId : null;
  grid.innerHTML = state.library.map(it=>`
    <div class="libcard${it.id===curId?" sel":""}" data-lib="${it.id}">
      <img src="${it.img}" alt="">
      <div class="nm">${it.no?`<b>${esc(it.no)}</b> `:""}${esc(it.name)}</div>
      <button class="rm" data-rm="${it.id}">フォルダから削除</button>
    </div>`).join("");

  grid.querySelectorAll("[data-lib]").forEach(card=>{
    card.onclick = ev=>{
      if (ev.target.closest("[data-rm]")) return; // 削除ボタンは別処理
      if (!pickTarget) return;                    // 一覧モードでは選択しない
      pushUndo();
      pickTarget.imgId = card.dataset.lib;
      delete pickTarget.img;                      // 旧形式の個別画像より優先させる
      closeLibrary(); render(); renderSide();
    };
  });
  grid.querySelectorAll("[data-rm]").forEach(b=>{
    b.onclick = ev=>{
      ev.stopPropagation();
      const id = b.dataset.rm;
      const used = state.objects.filter(o=>o.imgId===id).length;
      if (used && !confirm(`この画像は${used}件の作品で使われています。フォルダから削除しますか?`)) return;
      state.library = state.library.filter(it=>it.id!==id);
      for (const o of state.objects) if (o.imgId===id) delete o.imgId;
      renderLibrary(); render(); renderSide();
    };
  });
}
/* ---- 在庫パネル ----
   この図面での使用数と、他の展示室(別の図面)での使用数を並べて残数を出す。
   「他の図面」の入力は state.usedElsewhere[stockKey] に入り、JSON保存にも含まれる */
function openStock(){
  document.getElementById("stockModal").hidden = false;
  renderStock();
}
function closeStock(){ document.getElementById("stockModal").hidden = true; }
function renderStock(){
  if (!state.usedElsewhere) state.usedElsewhere = {};
  const rows = [];
  let lastCat = null;
  for (const s of state.stock){
    if (s.cat !== lastCat){
      lastCat = s.cat;
      rows.push(`<tr class="cat"><td colspan="5">${s.cat==="case"?"可動ケース":"展示台"}</td></tr>`);
    }
    const used = stockUsed(s.key), other = stockElsewhere(s.key), remain = stockRemain(s.key);
    const cls = remain > 0 ? "" : (remain < 0 ? " over" : " zero");
    rows.push(`<tr>
      <td>${esc(s.name)}${s.back?' <span style="color:#8c887c;font-size:11px">(背景)</span>':""}
        <div class="size">${s.w/1000}×${s.h/1000}m</div></td>
      <td>${s.total}</td>
      <td>${used}</td>
      <td><input type="number" min="0" step="1" data-other="${s.key}" value="${other}"></td>
      <td class="remain${cls}">${remain}</td>
    </tr>`);
  }
  document.getElementById("stockTable").innerHTML =
    `<thead><tr><th>種類</th><th>総数</th><th>この図面</th><th>他の図面</th><th>残</th></tr></thead>
     <tbody>${rows.join("")}</tbody>`;

  const over = state.stock.filter(s=>stockRemain(s.key) < 0);
  document.getElementById("stockNote").textContent = over.length
    ? `⚠ 台数が足りていません: ${over.map(s=>s.name).join("、")}`
    : "「この図面」は今開いている図面での使用数です(自動)";

  document.getElementById("stockTable").querySelectorAll("[data-other]").forEach(inp=>{
    inp.onchange = e=>{
      pushUndo();
      const v = Math.max(0, Math.round(+e.target.value || 0));
      state.usedElsewhere[inp.dataset.other] = v;
      e.target.value = v;
      renderStock(); render(); renderSide();
    };
  });
}
document.getElementById("stockBtn").onclick = openStock;
document.getElementById("stockClose").onclick = closeStock;
document.getElementById("stockModal").onclick = ev=>{ if (ev.target.id === "stockModal") closeStock(); };
document.getElementById("stockResetOther").onclick = ()=>{
  pushUndo();
  state.usedElsewhere = {};
  renderStock(); render(); renderSide();
};

document.getElementById("imgsBtn").onclick = ()=> openLibrary(null);
document.getElementById("libClose").onclick = closeLibrary;
document.getElementById("libModal").onclick = ev=>{ if (ev.target.id === "libModal") closeLibrary(); };
document.getElementById("libAddBtn").onclick = ()=> document.getElementById("imgsInput").click();
document.getElementById("libClear").onclick = ()=>{
  if (!pickTarget) return;
  pushUndo();
  delete pickTarget.imgId; delete pickTarget.img;
  closeLibrary(); render(); renderSide();
};

/* 画像フォルダへの追加(複数可)。圧縮してからstate.libraryに入れる。
   ファイル名に番号があれば、その番号の作品に自動で対応づく */
document.getElementById("imgsInput").onchange = async ev=>{
  const files = [...ev.target.files]; if (!files.length) return;
  const note = document.getElementById("libNote");
  let ok = 0, failed = 0;
  for (const f of files){
    if (note) note.textContent = `読み込み中… ${ok + failed + 1}/${files.length}`;
    try{ addToLibrary(f.name, await compressImage(f)); ok++; }
    catch(e){ failed++; }
  }
  if (!document.getElementById("libModal").hidden) renderLibrary();
  render(); renderSide();
  document.getElementById("hint").textContent =
    `画像フォルダに ${ok}件 追加しました` + (failed ? `(失敗: ${failed}件)` : "");
  ev.target.value = "";
};
document.getElementById("undoBtn").onclick = undo;
document.getElementById("redoBtn").onclick = redo;
document.getElementById("zoomIn").onclick = ()=> zoom(0.8);
document.getElementById("zoomOut").onclick = ()=> zoom(1.25);
document.getElementById("zoomFit").onclick = fitView;

window.addEventListener("resize", applyView);

/* ---- 初期化 ---- */
syncSheetUI(); render(); renderSide();
</script>
</body>
</html>
